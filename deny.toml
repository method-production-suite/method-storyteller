# cargo deny check: known advisories, licences and crate sources (the `deny` job in
# .github/workflows/ci.yml runs it on every push).

[advisories]
# Every advisory fails, unmaintained and unsound ones included, unless it is listed here with
# the reason it does not apply.
ignore = [
    # Unmaintained, no replacement upstream yet; reached only through krilla (craft-libs' PDF
    # writer) for shaping and reading the embedded Courier Prime. Drop when krilla moves off them.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: PDF text shaping inside krilla (craft-libs)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font parsing inside rustybuzz/krilla (craft-libs)" },
    # Unmaintained; reached only through eframe's Linux screen-reader bridge (accesskit_unix,
    # AT-SPI over D-Bus). Drop when accesskit moves off them.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux accessibility bridge in accesskit_unix (eframe)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux accessibility bridge in accesskit_unix (eframe)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux accessibility bridge in accesskit_unix (eframe)" },
]

[licenses]
# Everything we ship must be compatible with distributing Method Storyteller under MIT OR
# Apache-2.0. This is the list the dependency tree needs; a new licence fails CI until someone
# has looked at it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # File-level copyleft, used unmodified (option-ext, through dirs). Fine to ship alongside
    # MIT/Apache code.
    "MPL-2.0",
    # The fonts egui bundles for its interface (epaint's default fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common under eframe and wgpu; worth seeing, not worth failing.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-libs comes in pinned to one revision (Cargo.toml), including its vendored krilla.
allow-git = ["https://github.com/storytold/craft-libs"]
