<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Served for any address that has no page, at any depth, so its links start at the site
     root (methodstoryteller.com/). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Page not found: Method Storyteller</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="home" href="/" aria-label="Method Storyteller home">
      <picture>
        <source srcset="/assets/brand/wordmark-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="wm" src="/assets/brand/wordmark.svg" alt="" width="156" height="19">
      </picture>
    </a>
  </div>
</header>
<main class="notfound">
  <div class="wrap">
    <p class="kicker">404</p>
    <h1>This page isn't in the script.</h1>
    <p class="intro">There is nothing at this address. It may have moved, or the link may
      have a typo.</p>
    <div class="cta">
      <a class="btn primary" href="/">Go to the home page</a>
      <a class="btn ghost" href="https://github.com/method-production-suite/method-storyteller">Source code</a>
    </div>
  </div>
</main>
</body>
</html>
