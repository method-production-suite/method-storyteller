# Dependabot version updates (SUITE-STANDARDS.md §6): grouped, weekly. Security updates are not
# grouped: each arrives as its own pull request as soon as an advisory is published (enable them
# in Settings > Code security). GitHub Actions are left out: the suite's pinned SHAs move in
# every repository at once, together.
version: 2
updates:
  # The Rust workspace. The cooldown matches the 14-day crate-age check, so a version bump never
  # proposes a crate the check would refuse; majors wait longer.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
