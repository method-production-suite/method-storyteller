# Release builds on a version tag: the app packaged for macOS on Apple silicon (.dmg), Windows
# (Inno Setup installer) and Linux (.deb and AppImage), under version-free names so the
# website can link releases/latest/download/<file>, attached to a DRAFT GitHub release for a
# person to check and publish. Nothing is published by this workflow. How to cut a release:
# docs/RELEASING.md.
#
#   Method-Storyteller-macOS.dmg               Method-Storyteller-linux-amd64.deb
#   Method-Storyteller-windows-x64-setup.exe   Method-Storyteller-linux-x86_64.AppImage
#
# The packaging itself is `cargo xtask bundle-macos`, `dmg-macos`, `package-windows` and
# `package-linux` (xtask/src/package.rs), which also run on a developer's machine.
#
# Signing uses the suite's secret names (Method Budget's), so one 1Password item feeds every
# repository. Each signing step is skipped without its secrets; the build is the same
# otherwise (ad-hoc signed on the Mac, unsigned on Windows):
#   macOS signing:     DEVELOPER_ID_CERT_P12_BASE64 (the Developer ID Application .p12,
#                      base64), CERT_PASSWORD, KEYCHAIN_PASSWORD (any new password for the
#                      runner's throwaway keychain). The identity is the one the .p12 holds.
#   macOS notarizing:  AC_API_KEY_ID, AC_API_ISSUER_ID, AC_API_KEY_P8_BASE64 (an App Store
#                      Connect API key, the .p8 base64); needs the signing secrets too.
#   Windows signing:   WINDOWS_CERTIFICATE (a code signing .pfx, base64),
#                      WINDOWS_CERTIFICATE_PASSWORD. The suite's model step (Method
#                      Schedule's), for the app and the installer; no certificate exists
#                      yet, so it stays off.
#   Updates (macOS):   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the
#                      minisign update key in 1Password, "Method Storyteller - Update signing
#                      key"; its public half is PUBKEY in crates/app/src/updates.rs). With the
#                      key and a notarized build, the release also carries the updater archive
#                      Method-Storyteller_<version>_aarch64.app.tar.gz, its .sig, and
#                      latest.json, which installed apps read (`cargo xtask updater-archive`
#                      and `update-manifest`, xtask/src/updater.rs).
# Every compile happens before any secret reaches the runner.
#
# Least privilege: only the draft job writes. First-party actions only, pinned to the suite's
# full commit SHAs; no caches (release builds start clean). The two AppImage tools are
# downloaded from their GitHub releases and checked against pinned SHA-256 sums.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build, such as v0.1.0"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: tag, version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag matches the version in Cargo.toml, on main
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$tag is not a version tag (vX.Y.Z or vX.Y.Z-pre)."
            exit 1
          fi
          git checkout --quiet "refs/tags/$tag"
          version="$(cargo xtask version)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::The tag $tag is not v$version, the version in Cargo.toml."
            exit 1
          fi
          # The draft's description; nothing is built without it.
          notes="docs/releases/$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing: write it from docs/release-notes-template.md first."
            exit 1
          fi
          if grep -n '{{' "$notes"; then
            echo "::error::$notes still has {{placeholders}} from the skeleton."
            exit 1
          fi
          # A tag on a side branch must not build a release.
          if ! git merge-base --is-ancestor "$(git rev-list -n 1 "$tag")" origin/main; then
            echo "::error::$tag points at a commit that is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only (the suite standard).
          - name: macos-arm64
            os: macos-latest
          # Inno Setup 6 comes with this image.
          - name: windows-x64
            os: windows-2025
          # The oldest supported Ubuntu keeps the packages' glibc requirement low.
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Which optional secrets exist (true or false), never their values.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.CERT_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' && secrets.AC_API_KEY_P8_BASE64 != '' }}
      HAS_WIN_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # appimagetool 1.9.1 and the type 2 runtime 20251108 (AppImage project releases).
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false

      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev dpkg-dev

      - name: Add the Rust target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      # Every build runs before any secret reaches the runner, so no dependency's build
      # script runs while the signing keychain or the notarization key exists. The packaging
      # steps below use --no-build.
      - name: Build the app and the packaging tool
        env:
          TARGET: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
        run: |
          set -euo pipefail
          target=()
          if [ -n "$TARGET" ]; then target=(--target "$TARGET"); fi
          # ${a[@]+...}: an empty array is "unbound" under set -u in the Mac runner's bash 3.2.
          cargo build --release --locked --package method-storyteller --bin method-storyteller-app ${target[@]+"${target[@]}"}
          cargo build --locked --package xtask

      - name: Decide what gets signed
        run: |
          set -euo pipefail
          sign=no; notarize=no
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_DEVELOPER_ID" = true ]; then
            sign=yes
            if [ "$HAS_NOTARY_KEY" = true ]; then notarize=yes; fi
          fi
          echo "Developer ID signing: $sign. Notarizing: $notarize."
          if [ "$RUNNER_OS" = macOS ] && [ "$sign" = no ]; then
            echo "::notice::No Developer ID secrets: the macOS build is ad-hoc signed and not notarized (docs/RELEASING.md)."
          fi
          if [ "$RUNNER_OS" = Windows ] && [ "$HAS_WIN_SIGNING" != true ]; then
            echo "::notice::No Windows certificate: the installer is unsigned (docs/RELEASING.md)."
          fi
          { echo "MACOS_SIGN=$sign"; echo "MACOS_NOTARIZE=$notarize"; } >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Search this keychain first, keeping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          # The identity is the Developer ID Application the .p12 holds; its name stays out
          # of the repository.
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate holds no Developer ID Application identity."
            exit 1
          fi
          echo "::add-mask::$identity"
          { echo "APPLE_SIGNING_IDENTITY=$identity"; echo "SIGNING_KEYCHAIN=$keychain"; } >> "$GITHUB_ENV"

      - name: Prepare the notarization key (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and sign the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sign=()
          if [ "${MACOS_SIGN:-no}" = yes ]; then sign=(--sign "$APPLE_SIGNING_IDENTITY"); fi
          cargo xtask bundle-macos --target aarch64-apple-darwin --no-build ${sign[@]+"${sign[@]}"}

      - name: Notarize and staple the app (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        env:
          NOTARY_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="target/bundle/macos/Method Storyteller.app"
          zip="$RUNNER_TEMP/notarize-app.zip"
          ditto -c -k --keepParent "$app" "$zip"
          xcrun notarytool submit "$zip" --key "$APPLE_API_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$app"
          rm -f "$zip"

      - name: Make the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sign=()
          if [ "${MACOS_SIGN:-no}" = yes ]; then sign=(--sign "$APPLE_SIGNING_IDENTITY"); fi
          cargo xtask dmg-macos ${sign[@]+"${sign[@]}"}

      - name: Notarize and staple the disk image (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        env:
          NOTARY_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg="target/bundle/macos/Method-Storyteller-macOS.dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="target/bundle/macos/Method Storyteller.app"
          dmg="target/bundle/macos/Method-Storyteller-macOS.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Apple silicon only: a universal or Intel binary fails here.
          archs="$(lipo -archs "$app/Contents/MacOS/method-storyteller-app")"
          if [ "$archs" != arm64 ]; then
            echo "::error::The app binary is \"$archs\", not arm64 only."
            exit 1
          fi
          plutil -p "$app/Contents/Info.plist" | grep -F '"CFBundleIdentifier" => "com.methodstoryteller.desktop"'
          if [ "${MACOS_SIGN:-no}" = yes ]; then
            codesign --verify --strict --verbose=2 "$dmg"
          fi
          if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi

      # Only a notarized build is offered to installed apps: they would refuse anything
      # else, and an update must open without a warning.
      - name: The updater archive and its signature (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes' && env.HAS_UPDATER_KEY == 'true'
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          # xtask was built with everything else, before any secret.
          cargo xtask updater-archive --app "target/bundle/macos/Method Storyteller.app" --version "${TAG#v}" --out-dir target/bundle/updater
          ls -l target/bundle/updater

      - name: Forget the signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Windows signing, skipped without the secrets (the suite's model step, from Method
      # Schedule): the app itself before it goes into the installer, then the installer.
      - name: Sign the app (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 target/release/method-storyteller-app.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask package-windows --no-build

      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $code = 0
          foreach ($f in Get-ChildItem target/bundle/windows/*.exe) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE; break }
          }
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }

      - name: Build the packages (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --output "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl --fail --location --silent --show-error --output "$tools/runtime" "$APPIMAGE_RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tools/appimagetool" "$APPIMAGE_RUNTIME_SHA256" "$tools/runtime" | sha256sum --check --strict
          chmod +x "$tools/appimagetool"
          cargo xtask package-linux --no-build --appimagetool "$tools/appimagetool" --runtime "$tools/runtime"
          dpkg-deb --info target/bundle/linux/Method-Storyteller-linux-amd64.deb
          dpkg-deb --contents target/bundle/linux/Method-Storyteller-linux-amd64.deb

      - name: Collect the installers
        run: |
          set -euo pipefail
          mkdir -p dist meta
          case "$RUNNER_OS" in
            macOS)
              cp target/bundle/macos/Method-Storyteller-macOS.dmg dist/
              if [ -d target/bundle/updater ]; then cp target/bundle/updater/* dist/; fi
              echo "${MACOS_NOTARIZE:-no}" > meta/macos-notarized
              ;;
            Windows) cp target/bundle/windows/Method-Storyteller-windows-x64-setup.exe dist/ ;;
            Linux)
              cp target/bundle/linux/Method-Storyteller-linux-amd64.deb target/bundle/linux/Method-Storyteller-linux-x86_64.AppImage dist/
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: meta-${{ matrix.name }}
          path: meta/*
          if-no-files-found: error
          retention-days: 30

  draft:
    name: draft release
    # The only job with write access: it drafts the release with the notes and the
    # installers. Publishing the draft is left to a person.
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true
      - name: Every installer is here, under its version-free name
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          for f in Method-Storyteller-macOS.dmg Method-Storyteller-windows-x64-setup.exe \
                   Method-Storyteller-linux-amd64.deb Method-Storyteller-linux-x86_64.AppImage; do
            if [ ! -s "dist/$f" ]; then echo "::error::dist/$f is missing."; exit 1; fi
          done
          # The update manifest, when the Mac build brought the signed updater archive. It is
          # checked against the app's own public key before it is written.
          version="${TAG#v}"
          archive="Method-Storyteller_${version}_aarch64.app.tar.gz"
          if [ -s "dist/$archive" ] && [ -s "dist/$archive.sig" ]; then
            cargo xtask update-manifest --dir dist --version "$version" --out dist/latest.json
          else
            echo "::notice::No updater archive in this release (no update key, or not notarized): no latest.json, so installed apps won't see it (docs/RELEASING.md)."
          fi
          (cd dist && sha256sum -- * | tee "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" dist/
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          cp "docs/releases/$version.md" "$notes"
          if [ "$(cat meta/macos-notarized 2>/dev/null || echo no)" != yes ]; then
            printf '\n---\n\nThis macOS build is not notarized: the first time it opens, macOS blocks it. Then open System Settings > Privacy & Security and click Open Anyway.\n' >> "$notes"
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          ls -l dist
          # A re-run (workflow_dispatch) may refresh the files and notes of a draft, never
          # of a published release.
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published; cut the next version instead."
              exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              "${prerelease[@]}" --title "Method Storyteller $version" --notes-file "$notes"
          fi
