name: ci
# Pushes to main, and pull requests: a feature branch with a PR runs once, not twice
# (the free plan runs few jobs at a time across the whole org; SUITE-STANDARDS.md §6).
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, Mondays 06:00 UTC: the whole-lock crate-age check and cargo deny only (new
  # advisories, and anything that slipped past a pull request's changed-entries check).
  schedule:
    - cron: "0 6 * * 1"
# A new push to a pull request cancels its stale run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  gates:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - run: cargo xtask ci
  cooldown:
    # Crates published less than 14 days ago fail (scripts/check-crate-ages.py, SUITE-STANDARDS
    # §6): a pull request checks the entries it adds or bumps; every push to main and the weekly
    # run check the whole lock.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          else
            base=""
          fi
          # craft-libs and method-libs are pinned to one reviewed revision each (Cargo.toml).
          allow=(--allow-git https://github.com/storytold/craft-libs --allow-git https://github.com/method-production-suite/method-libs)
          if [ -n "$base" ]; then
            python3 scripts/check-crate-ages.py --only-changed "$base" "${allow[@]}"
          else
            python3 scripts/check-crate-ages.py "${allow[@]}"
          fi
  deny:
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml's `# ignore-expires:` date; fails once it has passed while the ignores it
      # covers are still listed.
      - run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
