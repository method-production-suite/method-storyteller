name: ci
# Pushes to main, and pull requests: a feature branch with a PR runs once, not twice
# (the free plan runs few jobs at a time across the whole org; SUITE-STANDARDS.md §6).
# A pull request opens as a draft and builds nothing; `gh pr ready` (ready_for_review) starts it,
# and later pushes to a ready pull request run again (SUITE-STANDARDS.md §6).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
# A new push to a pull request cancels its stale run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # What changed: docs-only changes (Markdown, docs/, site/, the README pictures) skip the Rust
  # build. Files the build compiles in or checks still build: CHANGELOG.md (What's New),
  # ATTRIBUTION.md, the licences and NOTICE (the Licenses window), docs/releases/ (the updater). The build jobs are skipped with `if:`, not
  # `paths-ignore`, so their required checks still report. Drafts run nothing at all.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base="${BEFORE:-}"
          fi
          # With nothing to compare with (a new branch, a schedule), build.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On its own line, so a failing diff stops the job instead of reading as docs-only.
          files="$(git diff --name-only "$base" HEAD)"
          others="$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/|^site/|^assets/screens/)' || true)"
          built="$(printf '%s\n' "$files" | grep -E '^(CHANGELOG\.md|ATTRIBUTION\.md|docs/releases/)' || true)"
          others="$others$built"
          if [ -n "$others" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: the Rust build is skipped."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
  # Lean CI (SUITE-STANDARDS.md §6, 2026-10-18): pull requests and main run the Linux gates
  # only; macOS and Windows run every night and on every release (nightly.yml, release.yml).
  # A named job rather than a one-entry matrix: a matrix skipped by a job-level `if:` reports
  # one check named `gates`, not the required one (actions/runner#952). No incremental state and
  # line-tables-only debug info keep target, and so the cache, small; only main saves the cache,
  # so pull requests restore main's and the repository stays under GitHub's 10 GB.
  gates-linux:
    name: gates (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: gates-${{ runner.os }}-
      - name: Linux packages for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - run: cargo xtask ci
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
  cooldown:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Fails a change that adds crates published less than 14 days ago (scripts/check-crate-ages.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare with what the branch had before: main for a pull request, the pushed-over
          # commit for a push, main for a new branch. With nothing to compare with, every crate
          # is checked.
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base=origin/main
          else
            base=""
          fi
          # craft-libs and method-libs are pinned to one reviewed revision each (Cargo.toml).
          allow=(--allow-git https://github.com/storytold/craft-libs --allow-git https://github.com/method-production-suite/method-libs)
          if [ -n "$base" ]; then
            python3 scripts/check-crate-ages.py --only-changed "$base" "${allow[@]}"
          else
            python3 scripts/check-crate-ages.py "${allow[@]}"
          fi
  deny:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml's `# ignore-expires:` date; fails once it has passed while the ignores it
      # covers are still listed.
      - run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
