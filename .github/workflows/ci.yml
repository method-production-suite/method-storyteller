name: ci
# Pushes to main, and pull requests: a feature branch with a PR runs once, not twice
# (the free plan runs few jobs at a time across the whole org; SUITE-STANDARDS.md §6).
on:
  push:
    branches: [main]
  pull_request:
# A new push to a pull request cancels its stale run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - run: cargo xtask ci
  cooldown:
    # Fails a change that adds crates published less than 14 days ago (scripts/check-crate-ages.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare with what the branch had before: main for a pull request, the pushed-over
          # commit for a push, main for a new branch. With nothing to compare with, every crate
          # is checked.
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base=origin/main
          else
            base=""
          fi
          # craft-libs is pinned to one reviewed revision (Cargo.toml).
          allow=(--allow-git https://github.com/storytold/craft-libs)
          if [ -n "$base" ]; then
            python3 scripts/check-crate-ages.py --only-changed "$base" "${allow[@]}"
          else
            python3 scripts/check-crate-ages.py "${allow[@]}"
          fi
  deny:
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
