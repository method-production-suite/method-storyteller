name: ci
# CI on pull requests and main (SUITE-STANDARDS.md §6, 2026-10-19, the ArtCraft-style plan): only
# the quick dependency checks run here. The session that wrote a change runs `cargo xtask ci`
# locally before marking its pull request ready, and pastes the result under "Tested locally".
# The full build on macOS, Windows and Linux runs weekly (full.yml) and before every release
# (release.yml).
# - A pull request opens as a draft and runs nothing; `gh pr ready` (ready_for_review) starts
#   it, and later pushes to a ready pull request run again. The crate-age check looks at the
#   lock entries it changes.
# - A push to main, and the weekly run (Mondays 06:00 UTC), check the whole lock: new
#   advisories, and versions that have aged out of the exceptions list.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"
# A newer run of the same branch cancels an older one, main included: main's checks only need
# its latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cooldown:
    # Crates published less than 14 days ago fail (scripts/check-crate-ages.py, SUITE-STANDARDS
    # §6): a pull request checks the entries it adds or bumps; every push to main and the weekly
    # run check the whole lock.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # craft-libs and method-libs are pinned to one reviewed revision each (Cargo.toml).
          allow=(--allow-git https://github.com/storytold/craft-libs --allow-git https://github.com/method-production-suite/method-libs)
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check-crate-ages.py --only-changed origin/main "${allow[@]}"
          else
            python3 scripts/check-crate-ages.py "${allow[@]}"
          fi

  deny:
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml's `# ignore-expires:` date; fails once it has passed while the ignores it
      # covers are still listed.
      - run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
