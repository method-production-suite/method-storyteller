[package]
name = "storyteller-macos-open"
description = "macOS: files opened from the Finder, received as the open documents Apple Event"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true

# The one crate allowed `unsafe`: the Objective-C calls below have no safe binding. It does not
# inherit the workspace's `unsafe_code = "forbid"`; every other lint is the workspace's.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSURL"] }
