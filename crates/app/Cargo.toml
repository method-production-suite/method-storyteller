[package]
name = "method-storyteller"
description = "Method Storyteller: an open-source screenwriting app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true

[[bin]]
name = "method-storyteller-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
# An update rehearsal: bakes a local endpoint, a throwaway key and plain HTTP from
# METHOD_STORYTELLER_UPDATE_ENDPOINT, _PUBKEY and _INSECURE (build.rs refuses them otherwise).
rehearsal = []

[dependencies]
storyteller-core = { workspace = true }
storyteller-engine = { workspace = true }
storyteller-pdf = { workspace = true }
craft-settings = { workspace = true }
craft-quit = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
craft-atomic = { workspace = true }
method-update = { workspace = true }
png = "0.18"

# The macOS menu bar. Same version craft-quit already brings in.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
# Draws the app to an image with no window, for `cargo xtask screens`.
egui_kittest = { version = "=0.36.2", features = ["eframe", "wgpu"] }
